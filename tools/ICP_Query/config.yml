system:
  host: 0.0.0.0
  port: 16181
  http_client_timeout: 30
  web_ui: true
  detail_concurrency: 1
  request_interval_ms: 1200
  retry_backoff_ms: 1500
  batch_keyword_retry_limit: 100
  batch_query_limit:
    enable: true
    request_interval_ms: 6000
    max_per_minute: 10
    window_seconds: 60
captcha:
  enable: true
  save_failed_img: false
  save_failed_img_path: faile_captcha
  retry_times: 100
  coding_code: auto
proxy:
  local_ipv6_pool:
    enable: false
    pool_num: 88
    check_interval: 1
    ipv6_network_card: eth0
  tunnel:
    enable: false
    url: null
  extra_api:
    url: null
    extra_interval: 3
    timeout: 100
    timeout_drop: 8
    check_proxy: false
    proxy_timeout: 0.5
    check_proxy_num: 20
    auto_maintenace: false
    pool_num: 0
risk_avoidance:
  allow_type:
  - web
  - app
  - mapp
  - kapp
  - bweb
  - bapp
  - bmapp
  - bkapp
  prohibit_suffix: []
log:
  dir: logs
  file_head: ymicp
  backup_count: 7
  save_log: false
  output_console: true
history:
  save_query_history: false
